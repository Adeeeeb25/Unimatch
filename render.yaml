services:
  # 1. Backend Web Service (Node.js + Express)
  - type: web
    name: unimatch-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unimatch-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_ID
        value: uni-admin
      - key: ADMIN_PASSWORD_HASH
        value: "$2b$12$gjAZir.Yh6HeTvHucPFd3O8Y6GwAbrxBRB4SvRobbSHjUuBRGT4LG"
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # 2. Frontend Web Service (React SPA on Vite)
  - type: web
    name: unimatch-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

# 3. PostgreSQL Managed Database
databases:
  - name: unimatch-db
    plan: free
    databaseName: unimatch
    user: unimatch_user
    postgresMajorVersion: "16"
